name: Huskelappen
version: "0.1.1"
slug: huskelappen
description: Leser ukebrev og PDF-er fra barnehagen og minner om hva som skal med
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8098
panel_icon: mdi:bag-personal
panel_title: Huskelappen
panel_admin: true
homeassistant_api: true
hassio_api: true
map:
  - type: media
    read_only: false
options:
  imap_enabled: false
  imap_host: imap.gmail.com
  imap_folder: INBOX
  imap_interval_minutes: 30
  imap_since_days: 14
schema:
  imap_enabled: bool
  imap_host: str
  imap_user: str?
  imap_password: password?
  imap_folder: str
  imap_sender: str?
  imap_interval_minutes: int(10,1440)
  imap_since_days: int(1,120)
