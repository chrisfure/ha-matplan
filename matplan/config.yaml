name: Matplan
version: "0.17.0"
slug: matplan
description: Kvitteringer, handleliste og middagsforslag ut fra det dere har og kalenderen
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: Matplan
panel_admin: false
homeassistant_api: true
hassio_api: true
map:
  - type: media
    read_only: false
options:
  imap_enabled: false
  imap_host: imap.gmail.com
  imap_folder: Matplan
  imap_interval_minutes: 15
  imap_since_days: 365
schema:
  imap_enabled: bool
  imap_host: str
  imap_user: str?
  imap_password: password?
  imap_folder: str
  imap_interval_minutes: int(5,1440)
  imap_since_days: int(1,2000)
  oda_email: str?
  oda_password: password?
  kassalapp_api_key: password?
